# cargo-deny policy (spec: docs/superpowers/specs/2026-09-29-aleph-arch-packaging-design.md).
[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Filled from `cargo deny check licenses` on Cargo.lock: only what the tree
# actually uses, reviewed by the owner.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Apache-2.0 WITH LLVM-exception",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# (Path dependencies between the workspace crates carry no version; they are
# allowed only because no crate is published. Registry wildcards stay denied.)
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
